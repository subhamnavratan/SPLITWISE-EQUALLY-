spring.application.name=SPLITWISE-EQUALLY
# =================================================================
# Core Server Configuration
# =================================================================
server.port=8080

# =================================================================
# MongoDB Configuration (Updated Database Name)
# =================================================================

# IMPORTANT CHANGE: Database name is set to SPLITWISE (Case-sensitive)
spring.data.mongodb.uri=mongodb://localhost:27017/SPLITWISE

# --- OR (Alternative, using separate properties) ---
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=SPLITWISE

# =================================================================
# Spring Web Configuration (CORS settings for the frontend)
# =================================================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*