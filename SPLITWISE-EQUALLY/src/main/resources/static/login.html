<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - SplitWise</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
<div class="auth-container">
    <h2>Login</h2>
    <form id="login-form">
        <label for="identifier">Phone Number or Email</label>
        <input type="text" id="identifier" placeholder="Enter phone number or email" required />

        <button type="submit">Login</button>
    </form>

    <p id="login-msg" class="message-area"></p>

    <p class="signup-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
</div>

<script src="login.js"></script>
</body>
</html>
